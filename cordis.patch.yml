# The bundle patch inserts one Loader row. The plugin serves the ComfyUI frontend
# under /comfyui (same origin as the DSH page) and exposes a small bridge API.
- insert:
    - id: dsh-comfyui
      name: '@local/dsh-comfyui'
      config:
        upstream: http://127.0.0.1:8188
        prefix: /comfyui
        # Optional advanced process supervision. The panel can start, stop, and
        # restart ComfyUI without this block; enabling it here takes precedence
        # and starts ComfyUI together with the Host.
        # supervise:
        #   enabled: true
        #   command: /path/to/ComfyUI/.venv/bin/python
        #   args: [main.py, --listen, 127.0.0.1, --port, '8188']
        #   cwd: /path/to/ComfyUI
        #   logPath: /var/log/comfyui/comfyui.log
