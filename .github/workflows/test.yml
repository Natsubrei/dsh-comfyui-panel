name: test

# The plugin ships without runtime dependencies; the checks are plain `node`
# scripts. TypeScript and @types/node are dev-only, for the `checkJs` pass that
# catches the calls a mocked test cannot — a wrong argument count, a stale
# result shape. The real-runtime contract needs a DeepSeek Harness checkout next
# to this one: `npm test` runs it when one is present and skips it here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is a supported target, not just the platform the author happens to
    # use: two of the bugs this suite found were Windows-only, and a Linux-only
    # matrix reported green through both. The ${{ matrix.os }} dimension makes
    # those failures land on the pull request instead.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene check scans every commit, so a shallow clone would
          # hide exactly the history leak it exists to catch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the type-check dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Checks, host smoke, editor ops, repository hygiene
        run: npm test
